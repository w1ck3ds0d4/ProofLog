# Publish ProofLog to NuGet on a version tag (e.g. `git tag v0.4.0 && git push --tags`).
#
# Publishing uses NuGet Trusted Publishing (OIDC), not a long-lived API key: the job
# exchanges a short-lived GitHub OIDC token for a temporary NuGet key at run time, so
# no secret is ever stored in this repository.
#
# One-time setup on nuget.org (Account -> Trusted Publishing -> Add):
#   Package owner:   w1ck3ds0d4
#   Repository:      w1ck3ds0d4/ProofLog
#   Workflow file:   release.yml
#   Environment:     (leave empty)
#
# Until that policy exists the login step fails, so the job still builds, tests and packs
# the tag and uploads the .nupkg as an artifact, and only the publish step is skipped.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required to request the OIDC token for Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build
      - run: dotnet pack src/ProofLog/ProofLog.csproj -c Release -o artifacts --no-build

      # Always keep the package as an artifact, even if publishing is not set up yet.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prooflog-nupkg
          path: artifacts/*.nupkg

      - name: Exchange OIDC token for a short-lived NuGet key
        id: login
        continue-on-error: true
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: w1ck3ds0d4

      - name: Push to NuGet
        if: steps.login.outcome == 'success'
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Report when publishing was skipped
        if: steps.login.outcome != 'success'
        run: |
          echo "::notice::Trusted Publishing is not configured yet, so the package was built and uploaded as an artifact but not published. Add the trusted publisher policy on nuget.org, then re-run this workflow."
